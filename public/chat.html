<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - AnonyChat</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/chat.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="toastContainer" class="toast-container"></div>
    
    <div id="searchScreen" class="searching-overlay" style="display: none;">
        <div style="text-align: center; max-width: 400px; padding: 20px;">
            <h2 style="font-size: 2rem; font-weight: 700; margin-bottom: 16px; color: var(--text-primary);">
                AnonyChat
            </h2>
            <p style="color: var(--text-secondary); margin-bottom: 32px;" data-i18n="tagline">
                Meet someone new. Stay anonymous.
            </p>
            <button id="findSomeoneBtn" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 16px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <span data-i18n="find_someone">Find Someone</span>
            </button>
            <button id="settingsBtn" class="btn btn-secondary" style="width: 100%; margin-top: 12px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
                </svg>
                <span data-i18n="settings">Settings</span>
            </button>
        </div>
    </div>
    
    <div id="searchingScreen" class="searching-overlay" style="display: none;">
        <div class="searching-animation">
            <div class="searching-circle"></div>
            <div class="searching-circle"></div>
            <div class="searching-circle"></div>
        </div>
        <p class="searching-text" data-i18n="searching">Searching for someone...</p>
        <button id="stopSearchBtn" class="btn btn-secondary" style="margin-top: 32px;">
            <span data-i18n="stop_searching">Stop Searching</span>
        </button>
    </div>
    
    <div id="chatScreen" class="chat-container" style="display: none;">
        <header class="chat-header">
            <div class="chat-header-left">
                <button class="icon-btn" onclick="stopCurrentChat()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"/>
                        <polyline points="12 19 5 12 12 5"/>
                    </svg>
                </button>
                <div class="chat-header-info">
                    <div class="chat-partner-name">Anonymous</div>
                    <div class="chat-partner-status">
                        <span class="status-dot online"></span>
                        <span id="partnerStatus" data-i18n="online">Online</span>
                    </div>
                </div>
            </div>
            <div class="chat-header-actions">
                <button id="reportBtn" class="icon-btn danger">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
                        <line x1="4" y1="22" x2="4" y2="15"/>
                    </svg>
                </button>
                <button id="blockBtn" class="icon-btn danger">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
                    </svg>
                </button>
                <button id="stopChatBtn" class="icon-btn danger">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
        </header>
        
        <div id="messagesContainer" class="chat-messages">
            <div id="typingIndicator" class="typing-indicator" style="display: none;">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <span class="typing-text" style="margin-left: 8px; font-size: 0.85rem; color: var(--text-secondary);"></span>
            </div>
        </div>
        
        <div class="chat-composer">
            <div class="composer-actions">
                <button id="emojiBtn" class="icon-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                        <line x1="9" y1="9" x2="9.01" y2="9"/>
                        <line x1="15" y1="9" x2="15.01" y2="9"/>
                    </svg>
                </button>
                <button id="imageBtn" class="icon-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                </button>
                <button id="voiceBtn" class="icon-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                        <path d="M19 10v2a7 7 0 01-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                </button>
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
            </div>
            <textarea id="messageInput" class="message-input" data-i18n-placeholder="type_message" rows="1"></textarea>
            <button id="sendBtn" class="send-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
        </div>
        
        <div id="emojiPicker" class="emoji-picker">
            <div class="emoji-grid">
                <button class="emoji-btn" data-emoji="❤️">❤️</button>
                <button class="emoji-btn" data-emoji="😂">😂</button>
                <button class="emoji-btn" data-emoji="👍">👍</button>
                <button class="emoji-btn" data-emoji="😮">😮</button>
                <button class="emoji-btn" data-emoji="😢">😢</button>
                <button class="emoji-btn" data-emoji="😡">😡</button>
                <button class="emoji-btn" data-emoji="🎉">🎉</button>
                <button class="emoji-btn" data-emoji="🔥">🔥</button>
                <button class="emoji-btn" data-emoji="💯">💯</button>
                <button class="emoji-btn" data-emoji="👋">👋</button>
                <button class="emoji-btn" data-emoji="🤗">🤗</button>
                <button class="emoji-btn" data-emoji="😊">😊</button>
            </div>
        </div>
        
        <div id="voiceRecorder" class="voice-recorder">
            <div class="recording-indicator"></div>
            <span class="recording-time" id="recordingTime">0:00</span>
            <button class="btn btn-danger" onclick="toggleVoiceRecording()" data-i18n="stop_recording">
                Stop Recording
            </button>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/chat.js"></script>
</body>
</html>
