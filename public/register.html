<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AnonyChat</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="language-switcher">
            <button class="lang-btn active" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="id">ID</button>
        </div>
        
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">AnonyChat</div>
                <h1 class="auth-title" data-i18n="register">Register</h1>
                <p class="auth-subtitle" data-i18n="tagline">Meet someone new. Stay anonymous.</p>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            
            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label class="form-label" data-i18n="email">Email</label>
                    <div class="form-input">
                        <input type="email" class="input" id="email" data-i18n-placeholder="email" required>
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" data-i18n="password">Password</label>
                    <div class="form-input">
                        <input type="password" class="input" id="password" data-i18n-placeholder="password" required>
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4"/>
                        </svg>
                    </div>
                    <div class="password-strength">
                        <div class="password-strength-bar" id="passwordStrengthBar"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" data-i18n="confirm_password">Confirm Password</label>
                    <div class="form-input">
                        <input type="password" class="input" id="confirmPassword" data-i18n-placeholder="confirm_password" required>
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4"/>
                        </svg>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" data-i18n="register">Register</button>
            </form>
            
            <div class="auth-footer">
                <span data-i18n="have_account">Already have an account?</span>
                <a href="/login.html" class="auth-link" data-i18n="login">Login</a>
            </div>
        </div>
    </div>
    
    <script src="/js/i18n.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('passwordStrengthBar');
            
            if (password.length === 0) {
                strengthBar.style.width = '0%';
            } else if (password.length < 6) {
                strengthBar.style.width = '33%';
                strengthBar.className = 'password-strength-bar password-strength-weak';
            } else if (password.length < 10) {
                strengthBar.style.width = '66%';
                strengthBar.className = 'password-strength-bar password-strength-medium';
            } else {
                strengthBar.style.width = '100%';
                strengthBar.className = 'password-strength-bar password-strength-strong';
            }
        });
    </script>
</body>
</html>
